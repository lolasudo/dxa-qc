# REST API / batch service limits. Paths come from env vars, not from here.
api:
  max_upload_bytes: 2147483648   # 2 GiB per uploaded archive; must match frontend VITE_MAX_UPLOAD_SIZE_MB and nginx
  max_queued_jobs: 8             # beyond this new batches get HTTP 429 instead of piling up
  max_pending_studies: 4         # concurrent synchronous /study requests (HTTP 429 beyond)
  job_ttl_hours: 24              # finished jobs (uploads, reports, previews) are deleted after this
  study_timeout_s: 180           # 3 min per study
  max_storage_bytes: 21474836480 # 20 GiB for all stored jobs; HTTP 507 beyond
  min_free_disk_bytes: 5368709120  # refuse uploads while < 5 GiB free on the data volume
  max_connections: 64            # uvicorn concurrency limit (HTTP 503 beyond)
