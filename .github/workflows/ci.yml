# Проверки на каждый push/PR: качество кода, тесты, сборка образов, безопасность, SBOM.
# Сторонние сканеры запускаются из их официальных образов с закреплёнными версиями -
# без сторонних actions; официальные actions закреплены по SHA коммита (теги можно перевесить).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  SYFT_IMAGE: anchore/syft:v1.52.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0
  # Принятые риски (обоснование - docs/SECURITY.md):
  #   PYSEC-2025-194  torch.jit.script - jit в сервисе не используется, веса грузятся через safetensors;
  #   PYSEC-2026-3447 setuptools, сборка sdist на macOS - к работе сервиса не относится
  #                   (torch 2.11 ограничивает setuptools < 82).
  PIP_AUDIT_IGNORE: --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2026-3447

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install (CPU torch + versions from the lock file)
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=81,<82"   # torch 2.11: setuptools < 82
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision==0.26.0
          grep -vE '^(#|torch|torchvision)' requirements-dev.lock > /tmp/constraints.txt
          pip install -c /tmp/constraints.txt -e ".[ml,api,train,dev]" bandit pip-audit
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        # Тесты на реальном датасете и весах пропускаются (их нет в репозитории).
        run: pytest -q
      - name: Bandit (static security analysis)
        run: bandit -q -r src
      - name: pip-audit (installed dependencies)
        run: pip-audit --local --skip-editable --progress-spinner off $PIP_AUDIT_IGNORE

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ShellCheck
        run: docker run --rm -v "$PWD/scripts:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -x $(cd scripts && ls *.sh)

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Semgrep (Python, OWASP Top 10, React/TS, Dockerfile, nginx, GitHub Actions, secrets)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE" semgrep scan --error --metrics off \
            --config p/python --config p/owasp-top-ten --config p/react --config p/typescript \
            --config p/dockerfile --config p/nginx --config p/github-actions --config p/secrets

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks (whole git history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --no-banner --redact

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images
        run: docker compose build
      - name: "Trivy (HIGH/CRITICAL with an available fix fail the build)"
        run: |
          for img in dxa-qc-backend:latest dxa-qc-frontend:latest; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /dev/null "$img"
          done
      - name: "Trivy (configuration: Dockerfiles, compose)"
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          for img in dxa-qc-backend dxa-qc-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
              "$img:latest" -o cyclonedx-json > "sbom/$img.cdx.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 90
