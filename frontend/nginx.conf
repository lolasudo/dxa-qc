# Защита от перегрузки: частота запросов и соединения на IP, таймауты против slowloris.
# Лимиты мягкие для одного-двух операторов и жёсткие для скриптов, заваливающих сервис запросами.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Офлайн-режим: никаких внешних ресурсов.
  include /etc/nginx/snippets/security-headers.conf;

  # Необязательный вход по паролю (HTTP Basic): scripts/set_password.sh кладёт сюда auth.conf
  # и htpasswd. Нет файлов - нет аутентификации (закрытый контур, автоматическая проверка).
  include /etc/nginx/auth.d/*.conf;

  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  keepalive_timeout 15s;
  limit_conn perip 30;
  limit_conn_status 429;
  limit_req_status 429;

  client_max_body_size 2048m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Заголовки к backend: фиксированный Host (не из запроса клиента) и реальный адрес пира без
  # присланной клиентом цепочки X-Forwarded-For - журнал аудита нельзя подделать заголовком.
  proxy_http_version 1.1;
  proxy_set_header Host backend;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Проверка живости контейнера и сервиса (без пароля, без журнала).
  location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = /api/v1/health {
    auth_basic off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass http://backend:8000;
  }

  # Загрузка исследований: строгий лимит частоты, тело идёт в backend потоком (без буферизации
  # 2 ГБ в памяти контейнера); backend сам обрывает запрос сверх лимита.
  location ~ ^/api/v1/(batch|study)$ {
    limit_req zone=upload burst=5 nodelay;
    proxy_request_buffering off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass http://backend:8000;
  }

  # Ответы API содержат медицинские данные: браузер и прокси их не сохраняют.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_hide_header Cache-Control;
    proxy_pass http://backend:8000;
  }

  # Статика с хешем в имени - кэшируется надолго.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  # index.html всегда проверяется заново: после обновления браузер получит новую версию.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
